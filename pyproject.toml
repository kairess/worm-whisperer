[project]
name = "worm-whisperer"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "c302>=0.12.0",
    "fastapi>=0.141.1",
    "jax==0.4.38; sys_platform == 'darwin'",
    "jaxlib==0.4.38; sys_platform == 'darwin'",
    "jax[cuda12]==0.7.1; sys_platform == 'linux'",   # 0.7.2+ 는 numpy>=2 요구. Linux 에선 GPU(JAX) 사용
    "matplotlib>=3.11.1",
    "neuron>=9.0.2",
    "numpy<2",
    "optax>=0.2.5",
    "pyneuroml>=1.3.22",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "sentence-transformers>=2.7,<3",
    "torch==2.2.2",
    "transformers>=4.40,<4.46",
    "uvicorn[standard]>=0.52.4",
    "websockets>=17.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]   # Linux: CPU 휠 (cu121 휠의 cuDNN 8.9 가 CUDA JAX 와 충돌; 임베딩은 CPU 로 충분)

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
