<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>llm-worm</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#ddd;display:grid;grid-template-columns:1fr 380px;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/3;padding:10px 16px;background:#1b1b1b;border-bottom:1px solid #333;display:flex;gap:16px;align-items:center}
#status{font-size:20px;font-weight:600;color:#ffd166}#rationale{font-size:12px;color:#999}
#arena{position:relative;background:#0b0b0b}canvas{display:block}
aside{border-left:1px solid #333;display:flex;flex-direction:column;padding:12px;gap:10px;overflow:hidden}
#chat{flex:1;overflow:auto;font-size:13px}#chat div{margin:4px 0}.me{color:#8ecae6}.bot{color:#ccc}
input{width:100%;padding:8px;background:#222;color:#eee;border:1px solid #444;border-radius:6px;font-size:14px}
#raster{width:100%;height:120px;background:#000}#muscle{width:100%;height:60px;background:#000}
small{color:#777}
</style></head><body>
<header><div>🪱 llm-worm</div><div id="status">정지</div><div id="rationale"></div></header>
<div id="arena"><canvas id="c"></canvas></div>
<aside>
 <div><small>302 뉴런 막전위 (mV, 어두울수록 −60, 밝을수록 0)</small><canvas id="raster"></canvas></div>
 <div><small>체벽근 활성 (위: 등쪽, 아래: 배쪽; 왼쪽이 머리)</small><canvas id="muscle"></canvas></div>
 <div id="readout"><small></small></div>
 <div id="chat"></div>
 <input id="cmd" placeholder="명령을 입력하세요: 앞으로 가 / 왼쪽으로 가 / 춤춰봐 / 유튜브 보는중" autofocus>
</aside>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');const ar=document.getElementById('arena');
function resize(){c.width=ar.clientWidth;c.height=ar.clientHeight}resize();addEventListener('resize',resize);
const ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');
let trail=[],names=null,scale=180,cam=[0,0];const R=document.getElementById('raster'),rc=R.getContext('2d'),M=document.getElementById('muscle'),mc=M.getContext('2d');
R.width=380;R.height=120;M.width=380;M.height=60;let rasterCol=0;
ws.onmessage=e=>{const f=JSON.parse(e.data);if(f.names){names=f.names;return}if(f.ack){log('bot',`→ ${f.ack.label} · ${f.ack.rationale} · 자극: ${f.ack.neurons.join(', ')} · ${f.ack.duration_s}s`);return}
 document.getElementById('status').textContent=f.label;document.getElementById('rationale').textContent=f.rationale;
 const x=f.x;const cx=x.reduce((a,p)=>a+p[0],0)/x.length,cy=x.reduce((a,p)=>a+p[1],0)/x.length;cam[0]+= (cx-cam[0])*0.05;cam[1]+=(cy-cam[1])*0.05;
 trail.push([cx,cy]);if(trail.length>2000)trail.shift();
 ctx.fillStyle='#0b0b0b';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#222';ctx.lineWidth=1;
 const W=v=>[c.width/2+(v[0]-cam[0])*scale,c.height/2-(v[1]-cam[1])*scale];
 for(let gx=-20;gx<=20;gx++){ctx.beginPath();const a=W([gx*0.5,-20]),b=W([gx*0.5,20]);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();const a2=W([-20,gx*0.5]),b2=W([20,gx*0.5]);ctx.beginPath();ctx.moveTo(a2[0],a2[1]);ctx.lineTo(b2[0],b2[1]);ctx.stroke()}
 ctx.strokeStyle='#345';ctx.beginPath();trail.forEach((p,i)=>{const q=W(p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.stroke();
 ctx.lineCap='round';for(let i=0;i<x.length-1;i++){const a=W(x[i]),b=W(x[i+1]);const w=0.08*scale*Math.sqrt(1-Math.pow((i-x.length/2)/(x.length/2),2))+2;ctx.lineWidth=w;ctx.strokeStyle=f.readout.quiescent?'#7a7':'#e9c46a';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
 const h=W(x[0]);ctx.fillStyle='#e76f51';ctx.beginPath();ctx.arc(h[0],h[1],4,0,7);ctx.fill();
 const stim=Object.keys(f.stim);ctx.fillStyle='#aaa';ctx.font='12px system-ui';ctx.fillText(`t=${f.t.toFixed(1)}s  gates(f,b)=${f.gates.map(v=>v.toFixed(0))}  ΔV AVB ${f.readout.dAVB?.toFixed(1)} AVA ${f.readout.dAVA?.toFixed(1)} SMD ${f.readout.dSMD?.toFixed(1)} RIS ${f.readout.dRIS?.toFixed(1)}  자극: ${stim.join(' ')||'없음'}`,10,c.height-10);
 const img=rc.getImageData(1,0,R.width-1,R.height);rc.putImageData(img,0,0);for(let i=0;i<f.V.length;i++){const v=Math.max(0,Math.min(1,(f.V[i]+60)/60));rc.fillStyle=`hsl(${240-200*v},80%,${20+50*v}%)`;rc.fillRect(R.width-1,Math.floor(i/f.V.length*R.height),1,1)}
 mc.fillStyle='#000';mc.fillRect(0,0,M.width,M.height);const n=f.A_D.length;for(let i=0;i<n;i++){mc.fillStyle=`rgba(255,120,60,${f.A_D[i]})`;mc.fillRect(i*M.width/n,0,M.width/n-1,28);mc.fillStyle=`rgba(80,160,255,${f.A_V[i]})`;mc.fillRect(i*M.width/n,32,M.width/n-1,28)}
};
function log(who,t){const d=document.createElement('div');d.className=who;d.textContent=t;const ch=document.getElementById('chat');ch.appendChild(d);ch.scrollTop=ch.scrollHeight}
document.getElementById('cmd').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){log('me',e.target.value);ws.send(JSON.stringify({command:e.target.value}));e.target.value=''}});
</script></body></html>
